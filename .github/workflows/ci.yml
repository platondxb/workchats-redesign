name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main queues instead of cancelling. A run on main is also the deploy, and cancelling one mid-deploy
  # would kill the remote script while it is rebuilding. Pull requests cancel, for quick feedback.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Types, lint, format, tokens, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:tokens
      - run: npm test

  build:
    name: Build, budgets, end-to-end and accessibility
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Home page is statically prerendered
        run: test -f .next/server/app/index.html

      - name: Every class used exists in the generated CSS
        run: npm run check:tokens

      - name: Performance budget (JS, total transfer, fonts, third parties)
        run: npm run check:bundle

      - run: npx playwright install --with-deps chromium

      - name: End-to-end and axe (desktop and mobile)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [quality, build]

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Check the deploy secrets are set
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done

      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, build and restart on the server
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          # Prevent git from hanging while waiting for credentials.
          export GIT_TERMINAL_PROMPT=0

          # Load NVM explicitly because this is a non-interactive SSH session.
          export NVM_DIR="/root/.nvm"

          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "FAILED: NVM was not found at $NVM_DIR"
            exit 1
          fi

          source "$NVM_DIR/nvm.sh"

          # Production Node.js version.
          nvm use 24.21.0

          echo "Node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "pm2:  $(pm2 -v)"

          cd /root/workchats-redesign

          # Make sure all required tools are available.
          for tool in git npm pm2; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "FAILED: $tool is not available"
              echo "PATH=$PATH"
              exit 1
            fi
          done

          # Remember the currently deployed revision.
          before="$(git rev-parse HEAD)"

          # Get the latest state of main from GitHub.
          echo "Fetching origin/main..."
          git fetch origin main

          # The GitHub repository is the source of truth.
          after="$(git rev-parse origin/main)"

          if [ "$before" = "$after" ]; then
            echo "Server is already at ${after:0:8}; nothing to deploy."
            exit 0
          fi

          echo "Deploying ${before:0:8} -> ${after:0:8}"

          # Discard all local tracked changes and make the server
          # exactly match origin/main.
          git reset --hard origin/main

          # Remove untracked files that are not part of the repository.
          # This keeps the working tree clean while preserving runtime
          # files managed outside Git.
          git clean -fd

          echo "Installing dependencies from package-lock.json..."
          npm ci

          echo "Building application..."
          npm run build

          echo "Restarting application..."
          pm2 restart workchats

          echo "Deployed ${after:0:8}."
          REMOTE
